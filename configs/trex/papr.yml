index: "papr"
save_dir: "./experiments/trex"
use_amp: true
max_num_pts: 30000
rnd_background: false
rnd_background_use_dumb_constant: false
original_control_points_path: "./data/trex/multiview/key_points/edit_0040.ply"
deformed_control_points_folder: "./data/trex/multiview/key_points/"
eval_deform_frames: [1, 10, 22]
influ_scores_fuse_type: "add"
wandb:
  enabled: false
  project: "rigpapr"
  entity: null
  name: null
  tags: ["sketchfab", "rexy", "rigging", "mask-loss", "half-res"]
  notes: "Half-resolution (400x400) variant with factor=2"
  config: {}
dataset:
  path: "./data/trex/multiview"
  factor: 2
  batch_size: 100
  load_gt_depth: false
  save_gt_sp: false
  gt_depth_dir: null
  patches:
    width: 16
    height: 16
geoms:
  points:
    load_path: "./data/trex/multiview/key_points/edit_0040.ply"
    select_k: 40
    select_k_type: "knn_frustum"
    drop_points_max_ratio: 0.9
    drop_points_max_ratio_schedule_type: "cosine"
    drop_points_max_ratio_start_step: 0
    drop_points_max_ratio_end_step: -1
    init_num: 10000
    influ_init_func: "ones"
    influ_init_val: 1
    project: false
    add_type: "clone"
    add_sample_type: "acc-coord-grad-norm-cnt-max"
    save_added_points: true
    init_scale: [1.2, 1.2, 1.2]
    init_center: [0.0, 0.0, 0.0]
    use_bkg_points: false
    bkg_points_num: 10000
    bkg_points_init_scale: [5.0, 5.0, 5.0]
    bkg_points_influ_init_val: -1.0
    bkg_points_embedv_learn: false
    bkg_points_alpha_blend: false
    bkg_points_add_noise: false
    bkg_points_noise_std: 0.0
    bkg_points_noise_max_clip: null
    use_bkg_points_pc_feats_mlp: true
    bkg_points_pc_feats_encode_config:
      otype: "Frequency"
      n_frequencies: 6
      with_self: true
      stop_gradient: false
      pe_scale: 1.0
    bkg_points_pc_feats_mlp_config:
      otype: "FullyFusedMLP"
      activation: "ReLU"
      output_activation: "None"
      n_neurons: 64
      n_hidden_layers: 2
  background:
    learn_bkg_token: true
    constant: 5.0
models:
  normalize_topk_attn: false
  point_on_ray_loss_type: "distance2"
  point_on_ray_loss_mask_thresh: 0.5
  point_on_ray_loss_norm_topk_attn: false
  point_on_ray_loss_detach_points: true
  point_on_ray_loss_use_gt_mask: true
  point_on_ray_loss_erose_mask: true
  point_on_ray_loss_erose_mask_iters: 1
  point_to_sp_loss_mask_thresh: 0.5
  point_to_sp_loss_distance_thresh: -1
  point_to_sp_loss_norm_topk_attn: true
  point_to_sp_loss_fuse_type: "position"
  point_to_sp_loss_detach_attn: true
  attn:
    append_bkg_points: true
    append_bkg_points_use_embedv: true
    append_bkg_points_embedv_init_type: "randn"
    append_bkg_points_embedv_learn: true
    append_bkg_points_alpha_blend: false
    bkg_exp_scaler: false
    bkg_exp_scaler_init: 1.0
    scale_bkg_token_by_num_bkg_points: false
    scale_bkg_token_by_num_bkg_points_init: 1.0
    shared_network: false
    k_type: 13
    q_type: 5
    v_type: 2
    output_dim_k: 128
    output_dim_q: 128
    output_dim_v: 3
    score_act: "none"
    score_scale: 1.0
    use_score_scaler: false
    scale_scores_by_dist: true
    attn_score_dist_strategy: 'gamma'
    attn_dist_power: 2
    attn_dist_near_exp: 0
    attn_dist_far_exp: -3.0
    attn_dist_min_spread: 2
    scale_scores_by_dist_decay: 10.0
    dist_prior_floor: 0.0
    dist_prior_gamma: 1.0
    network_k_config:
      otype: "FullyFusedMLP"
      activation: "LeakyReLU"
      output_activation: "None"
      n_neurons: 128
      n_hidden_layers: 2
    network_q_config:
      otype: "FullyFusedMLP"
      activation: "LeakyReLU"
      output_activation: "None"
      n_neurons: 128
      n_hidden_layers: 2
    network_v_config:
      otype: "FullyFusedMLP"
      activation: "LeakyReLU"
      output_activation: "None"
      n_neurons: 128
      n_hidden_layers: 2
    encode_k_config:
      otype: "Frequency"
      n_frequencies: 6
      with_self: true
      pe_scale: 1.0
    encode_q_config:
      otype: "Frequency"
      n_frequencies: 6
      with_self: true
      pe_scale: 1.0
    encode_v_config:
      otype: "Frequency"
      n_frequencies: 6
      with_self: true
      pe_scale: 1.0
  unet:
    use: false
    last_act: "softplus_1_1_0"
  topk_mlp:
    learn: false
    type: 2
    minus_mean: false
    learn_bias: false
    loss_type: "bce"
    quantile: 0.5
    weight_quantile: true
    start_step: -1
    logit_scale: 1.0
    means: []
    init_weights: [2.0e-3]
    weight_act: "none"
    act_idxs: []
training:
  point_on_ray_loss_start: 0
  point_on_ray_loss_stop: 0
  point_on_ray_loss_weight: 0.0
  point_on_ray_loss_scale_by_rgb_loss: false
  point_on_ray_loss_schedule: "constant"
  point_to_sp_loss_start: 0
  point_to_sp_loss_stop: 0
  point_to_sp_loss_weight: 0.0
  gt_sp_loss_start: 0
  gt_sp_loss_stop: 250000
  gt_sp_loss_weight: 0.01
  gt_sp_loss_scale_by_rgb_loss: false
  gt_sp_loss_exclude_boundary: true
  gt_sp_loss_boundary_width: 5
  prune_steps: 500
  prune_start: 10000
  prune_stop: 250000
  prune_thresh: 1.01e-5
  prune_thresh_list: []
  prune_steps_list: []
  prune_max_num: 2000
  prune_max_num_step: 50000
  prune_type: "<"
  add_steps: 1000
  add_start: 15000
  add_stop: 200000
  add_num: 1000
  losses:
    mse: 1.0
    lpips: 0.01
    lpips_alex: 0.0
    ssim: 0.0
  lr:
    points:
      base_lr: 1.0e-3
    topk_mlp:
      type: "cosine"
      base_lr: 1.0e-3
      factor: 1
      warmup: 10000
      weight_decay: 0
    points_influ_scores:
      type: "cosine-hlfperiod"
      base_lr: 5.0e-3
      factor: 1
      warmup: 0
      weight_decay: 0
    bkg_points_pc_feats:
      type: "cosine"
      base_lr: 1.0e-3
      factor: 1
      warmup: 10000
      weight_decay: 0
    bkg_points_influ_scores:
      type: "cosine"
      base_lr: 1.0e-3
      factor: 1
      warmup: 10000
      weight_decay: 0
    bkg_points:
      type: "cosine"
      base_lr: 1.0e-3
      factor: 1
      warmup: 10000
      weight_decay: 0
  # --- mask / silhouette loss (Stage 1) ---
  # Uses MSE(bkg_attn, 1 - GT_mask) to enforce silhouette alignment.
  # GT masks must be pre-extracted first.
  alpha_loss_weight: 0.05       # default 0.0 — enable silhouette supervision
  alpha_loss_start: -1          # -1 = active from step 0
  alpha_loss_stop: 1.0e+9
  alpha_loss_scale_by_rgb_loss: false
  alpha_loss_schedule: "constant"
eval:
  dataset:
    path: "./data/trex/multiview"
    factor: 2
  img_idx: 0
test:
  max_height: 100
  max_width: 100
  datasets:
    - name: "testset"
      path: "./data/trex/multiview"
      factor: 2
